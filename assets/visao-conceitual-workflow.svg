<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
  <title id="title">Triagem Inteligente de Notas Fiscais</title>
  <desc id="desc">Fluxo demonstrativo no n8n com simulação de OCR, validação, aprovação, rejeição, armazenamento e notificações.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1119"/><stop offset="1" stop-color="#18212d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#9ba8b6"/></marker>
    <style>.h1{font:700 40px Arial,sans-serif;fill:#f7f9fc}.sub{font:20px Arial,sans-serif;fill:#c1cad5}.node{fill:#252e39;stroke:#aeb8c4;stroke-width:2}.nt{font:700 15px Arial,sans-serif;fill:#fff}.ns{font:14px Arial,sans-serif;fill:#aeb9c7}.line{fill:none;stroke:#9ba8b6;stroke-width:3;marker-end:url(#arrow)}.label{font:700 16px Arial,sans-serif}.panel{fill:#202a36;stroke:#344151}.ph{font:700 19px Arial,sans-serif;fill:#f4f7fb}.pb{font:16px Arial,sans-serif;fill:#c5cfdb}.pdh{font:700 19px Arial,sans-serif;fill:#17202b}.pdb{font:16px Arial,sans-serif;fill:#253241}.foot{font:15px Arial,sans-serif;fill:#8997a7}</style>
  </defs>
  <rect width="1536" height="900" fill="url(#bg)"/>
  <text x="54" y="62" class="h1">Triagem Inteligente de Notas Fiscais</text><text x="54" y="96" class="sub">Simulação demonstrativa do processo de extração, validação e decisão</text>
  <rect x="1275" y="35" width="205" height="76" rx="14" fill="#222c38" stroke="#344151"/><text x="1295" y="65" class="pb">Workflow n8n</text><text x="1295" y="91" class="foot">Versão acadêmica • Demo</text>
  <path d="M190 260H274M424 260H508M658 260C700 260 700 205 742 205M658 260C700 260 700 355 742 355M892 205H976M1126 205H1210M892 355H976M1126 355H1210" class="line"/>
  <text x="690" y="205" class="label" fill="#55d98a">Válido</text><text x="686" y="350" class="label" fill="#ff6b5f">Inválido</text>
  <g filter="url(#shadow)"><rect x="40" y="205" width="150" height="110" rx="16" class="node"/><circle cx="115" cy="241" r="20" fill="#4c8dff"/><path d="M108 228l20 14-20 14z" fill="white"/><text x="115" y="286" text-anchor="middle" class="nt">1. Início manual</text><text x="115" y="306" text-anchor="middle" class="ns">Manual Trigger</text></g>
  <g filter="url(#shadow)"><rect x="274" y="205" width="150" height="110" rx="16" class="node"/><circle cx="349" cy="241" r="20" fill="#5aa8ff"/><text x="349" y="247" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">OCR</text><text x="349" y="286" text-anchor="middle" class="nt">2. OCR simulado</text><text x="349" y="306" text-anchor="middle" class="ns">Set</text></g>
  <g filter="url(#shadow)"><rect x="508" y="205" width="150" height="110" rx="16" class="node"/><circle cx="583" cy="241" r="20" fill="#55c97a"/><path d="M570 231h26l-10 11v10l-6 4v-14z" fill="white"/><text x="583" y="286" text-anchor="middle" class="nt">3. Validação</text><text x="583" y="306" text-anchor="middle" class="ns">IF • Valor &gt; 0</text></g>
  <g filter="url(#shadow)"><rect x="742" y="150" width="150" height="110" rx="16" class="node"/><circle cx="817" cy="186" r="20" fill="#55c97a"/><path d="M807 186l7 7 14-16" fill="none" stroke="white" stroke-width="4"/><text x="817" y="231" text-anchor="middle" class="nt">4. Aprovação</text><text x="817" y="251" text-anchor="middle" class="ns">Status aprovado</text></g>
  <g filter="url(#shadow)"><rect x="742" y="330" width="150" height="110" rx="16" class="node"/><circle cx="817" cy="366" r="20" fill="#ff6258"/><path d="M808 357l18 18M826 357l-18 18" stroke="white" stroke-width="4"/><text x="817" y="411" text-anchor="middle" class="nt">5. Rejeição</text><text x="817" y="431" text-anchor="middle" class="ns">Erro registrado</text></g>
  <g filter="url(#shadow)"><rect x="976" y="150" width="150" height="110" rx="16" class="node"/><circle cx="1051" cy="186" r="20" fill="#9b7ced"/><ellipse cx="1051" cy="180" rx="12" ry="5" fill="white"/><path d="M1039 180v13c0 7 24 7 24 0v-13" fill="white" opacity=".85"/><text x="1051" y="231" text-anchor="middle" class="nt">6. Armazenamento</text><text x="1051" y="251" text-anchor="middle" class="ns">Simulado com Set</text></g>
  <g filter="url(#shadow)"><rect x="1210" y="150" width="150" height="110" rx="16" class="node"/><circle cx="1285" cy="186" r="20" fill="#55c97a"/><path d="M1271 178h28v18h-28zM1271 178l14 11 14-11" fill="none" stroke="white" stroke-width="3"/><text x="1285" y="231" text-anchor="middle" class="nt">7. Aprovação</text><text x="1285" y="251" text-anchor="middle" class="ns">Notificação simulada</text></g>
  <g filter="url(#shadow)"><rect x="976" y="330" width="150" height="110" rx="16" class="node"/><circle cx="1051" cy="366" r="20" fill="#ff6258"/><path d="M1041 374h20l-3-5v-8c0-5-3-9-7-9s-7 4-7 9v8z" fill="white"/><text x="1051" y="411" text-anchor="middle" class="nt">8. Erro tratado</text><text x="1051" y="431" text-anchor="middle" class="ns">Rota demonstrativa</text></g>
  <g filter="url(#shadow)"><rect x="1210" y="330" width="150" height="110" rx="16" class="node"/><circle cx="1285" cy="366" r="20" fill="#ff6258"/><path d="M1272 354h4v24h-4zM1276 355c12-7 17 7 28 0v13c-11 7-16-7-28 0z" fill="white"/><text x="1285" y="411" text-anchor="middle" class="nt">9. Rejeição</text><text x="1285" y="431" text-anchor="middle" class="ns">Saída simulada</text></g>
  <g><rect x="54" y="520" width="440" height="230" rx="18" fill="#edd267"/><text x="82" y="558" class="pdh">ENTRADA E EXTRAÇÃO</text><text x="82" y="594" class="pdb">O acionamento é manual para testes públicos.</text><text x="82" y="626" class="pdb">O nó Set simula os campos extraídos:</text><text x="98" y="660" class="pdb">• fornecedor  • número da nota</text><text x="98" y="692" class="pdb">• valor  • vencimento  • status</text><text x="82" y="726" class="pdb">Em um piloto, o Set pode ser trocado por OCR real.</text></g>
  <g><rect x="548" y="520" width="440" height="230" rx="18" fill="#a9dfb0"/><text x="576" y="558" class="pdh">VALIDAÇÃO E DECISÃO</text><text x="576" y="594" class="pdb">Regra implementada no workflow:</text><rect x="576" y="613" width="240" height="38" rx="9" fill="#86c994"/><text x="594" y="638" class="pdb">Valor deve ser maior que zero</text><text x="576" y="684" class="pdb">Verdadeiro → status APROVADA</text><text x="576" y="716" class="pdb">Falso → status REJEITADA + erro</text></g>
  <g><rect x="1042" y="520" width="440" height="230" rx="18" fill="#cbb9df"/><text x="1070" y="558" class="pdh">SAÍDAS SIMULADAS</text><text x="1070" y="594" class="pdb">O projeto demonstra o comportamento esperado:</text><text x="1086" y="630" class="pdb">• armazenamento do documento aprovado</text><text x="1086" y="662" class="pdb">• aviso ao setor financeiro</text><text x="1086" y="694" class="pdb">• registro e tratamento da rejeição</text><text x="1070" y="726" class="pdb">Tudo sem exigir credenciais externas.</text></g>
  <rect x="54" y="808" width="1428" height="2" fill="#344151"/><text x="54" y="846" class="foot">Visual nativo para GitHub • Simulação acadêmica executável • Sem credenciais ou documentos fiscais reais</text><text x="1482" y="846" text-anchor="end" class="foot">github.com/sandrozdb</text>
</svg>
